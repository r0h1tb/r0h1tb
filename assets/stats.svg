<svg xmlns="http://www.w3.org/2000/svg" width="860" height="308" viewBox="0 0 860 308" role="img" aria-label="GitHub activity: 38 merged upstream pull requests, 22 projects contributed to, 173 contributions in the last year, 61 pull requests opened">
  <defs>
