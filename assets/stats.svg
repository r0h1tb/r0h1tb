      <rect x="320.5" y="200" width="182.7" height="16" fill="#3776AB"/>
      <rect x="503.2" y="200" width="109.6" height="16" fill="#ED8B00"/>
      <rect x="612.8" y="200" width="109.6" height="16" fill="#3178C6"/>
