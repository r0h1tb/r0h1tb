      <text x="128" y="155" font-size="12" fill="#6c7086">pull requests</text>

      <text x="330" y="114" font-size="42" font-weight="700" fill="#89b4fa">22</text>
      <text x="330" y="138" font-size="12" fill="#a6adc8">open-source</text>
      <text x="330" y="155" font-size="12" fill="#6c7086">projects</text>

