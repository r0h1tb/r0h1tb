      <rect x="322" y="76" width="196" height="26" rx="6" fill="#313244"/>
      <text x="334" y="94" font-size="12.5" fill="#cba6f7" font-weight="700">478K combined stars</text>
      <rect x="526" y="76" width="164" height="26" rx="6" fill="#313244"/>
      <text x="538" y="94" font-size="12.5" fill="#f9e2af" font-weight="700">14 more in review</text>
