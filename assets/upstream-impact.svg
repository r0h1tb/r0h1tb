      <text x="624" y="179" fill="#a6adc8" font-size="12">75,588 ★</text>
      <rect x="740" y="168" width="30" height="15" rx="7.5" fill="#313244"/><text x="748" y="179" fill="#a6e3a1" font-size="11" font-weight="700">1</text>

