    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#89b4fa"/><stop offset="50%" stop-color="#cba6f7"/><stop offset="100%" stop-color="#94e2d5"/></linearGradient>
    <clipPath id="c"><rect width="860" height="524" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#c)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
