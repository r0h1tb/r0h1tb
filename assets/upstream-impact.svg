    <line x1="28" y1="494" x2="832" y2="494" stroke="#313244" stroke-width="1.5"/>
    <text x="28" y="512" font-size="11.5" fill="#6c7086">raged: top external contributor — Tree-sitter, Neo4j, Qdrant. Star counts as of September 2026.</text>
