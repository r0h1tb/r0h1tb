      <rect x="740" y="333" width="30" height="15" rx="7.5" fill="#313244"/><text x="748" y="344" fill="#a6e3a1" font-size="11" font-weight="700">1</text>

      <!-- goreleaser -->
      <text x="28" y="377" fill="#cdd6f4">goreleaser</text>
